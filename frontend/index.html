<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sporting Risk Widget Example</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Georgia, "Times New Roman", serif;
            background:
                radial-gradient(circle at top left, rgba(17, 108, 128, 0.24), transparent 28%),
                linear-gradient(180deg, #f1ece2 0%, #e3dbcf 100%);
            color: #1f1a14;
        }

        .example-shell {
            max-width: 1180px;
            margin: 0 auto;
            padding: 48px 20px 80px;
        }

        .example-hero {
            display: grid;
            gap: 18px;
            margin-bottom: 28px;
        }

        .example-kicker {
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-size: 0.75rem;
            color: #72553f;
        }

        .example-hero h1 {
            margin: 0;
            font-size: clamp(2.5rem, 5vw, 4.6rem);
            line-height: 0.95;
        }

        .example-hero p {
            max-width: 760px;
            margin: 0;
            color: #5f5041;
            font-size: 1.05rem;
            line-height: 1.6;
        }

        .example-controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .example-controls button {
            border: 0;
            border-radius: 999px;
            padding: 12px 18px;
            background: #1a6c80;
            color: white;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
        }

        .example-controls button.is-secondary {
            background: #b9501f;
        }

        #sr-widget-root {
            --sr-primary-accent: #b9501f;
            --sr-bg-color: #f6f1e7;
            --sr-color-secondary: #155d6e;
        }
    </style>
</head>
<body>
    <div class="example-shell">
        <section class="example-hero">
            <div class="example-kicker">Operator Match Page</div>
            <h1>Arsenal vs Chelsea</h1>
            <p>
                This example page simulates a third-party operator environment with its own typography,
                background treatment, and widget theme overrides. The widget below is injected directly
                into the page DOM and reads its page context from the script tag.
            </p>
        </section>

        <div class="example-controls">
            <button type="button" data-phase="PRE_MATCH" data-testid="example-phase-pre-match">Force Pre-Match</button>
            <button type="button" data-phase="LINEUPS_CONFIRMED" data-testid="example-phase-lineups">Force Line-Ups Confirmed</button>
            <button type="button" data-phase="LIVE" data-testid="example-phase-live">Force Live</button>
            <button type="button" data-phase="HALF_TIME" data-testid="example-phase-half-time">Force Half-Time</button>
            <button type="button" data-phase="FULL_TIME" data-testid="example-phase-full-time">Force Full-Time</button>
            <button type="button" id="auto-simulate-toggle" class="is-secondary" data-testid="example-phase-auto">Auto Simulate Match</button>
        </div>

        <div id="sr-widget-root"></div>
    </div>

    <script
        src="/static/loader.js"
        data-page-type="match"
        data-client="demo"
        data-match-id="12345"
        data-default-tab="table"
        data-theme="light"
        data-poll-interval-ms="5000"
    ></script>
    <script>
        (function () {
            var phases = {
                PRE_MATCH: { phase: 'PRE_MATCH', clock: 0, home_score: 0, away_score: 0, home_team: 'Arsenal', away_team: 'Chelsea', lineups_confirmed: false },
                LINEUPS_CONFIRMED: { phase: 'PRE_MATCH', clock: 0, home_score: 0, away_score: 0, home_team: 'Arsenal', away_team: 'Chelsea', lineups_confirmed: true },
                LIVE: { phase: 'LIVE', clock: 34, home_score: 1, away_score: 0, home_team: 'Arsenal', away_team: 'Chelsea', lineups_confirmed: true },
                HALF_TIME: { phase: 'HALF_TIME', clock: 45, home_score: 1, away_score: 0, home_team: 'Arsenal', away_team: 'Chelsea', lineups_confirmed: true },
                FULL_TIME: { phase: 'FULL_TIME', clock: 90, home_score: 2, away_score: 1, home_team: 'Arsenal', away_team: 'Chelsea', lineups_confirmed: true }
            };
            var autoSimulateButton = document.getElementById('auto-simulate-toggle');
            var autoSimulationTimer = null;
            var autoSimulationIndex = 0;
            var autoSimulationTimeline = [
                { phase: 'PRE_MATCH', clock: 0, home_score: 0, away_score: 0, home_team: 'Arsenal', away_team: 'Chelsea', lineups_confirmed: false },
                { phase: 'PRE_MATCH', clock: 0, home_score: 0, away_score: 0, home_team: 'Arsenal', away_team: 'Chelsea', lineups_confirmed: true },
                { phase: 'LIVE', clock: 12, home_score: 0, away_score: 0, home_team: 'Arsenal', away_team: 'Chelsea', lineups_confirmed: true },
                { phase: 'LIVE', clock: 34, home_score: 1, away_score: 0, home_team: 'Arsenal', away_team: 'Chelsea', lineups_confirmed: true },
                { phase: 'HALF_TIME', clock: 45, home_score: 1, away_score: 0, home_team: 'Arsenal', away_team: 'Chelsea', lineups_confirmed: true },
                { phase: 'LIVE', clock: 67, home_score: 1, away_score: 1, home_team: 'Arsenal', away_team: 'Chelsea', lineups_confirmed: true },
                { phase: 'LIVE', clock: 82, home_score: 2, away_score: 1, home_team: 'Arsenal', away_team: 'Chelsea', lineups_confirmed: true },
                { phase: 'FULL_TIME', clock: 90, home_score: 2, away_score: 1, home_team: 'Arsenal', away_team: 'Chelsea', lineups_confirmed: true }
            ];

            function applyExampleState(nextState) {
                if (!window.__srContainer) {
                    return;
                }

                window.__srMockStateOverride = Object.assign({}, nextState);
                window.__srContainer.applyState(nextState);
            }

            function updateAutoSimulateButton() {
                if (!autoSimulateButton) {
                    return;
                }

                autoSimulateButton.textContent = autoSimulationTimer
                    ? 'Stop Auto Simulation'
                    : 'Auto Simulate Match';
            }

            function stopAutoSimulation() {
                if (autoSimulationTimer) {
                    window.clearInterval(autoSimulationTimer);
                    autoSimulationTimer = null;
                }

                autoSimulationIndex = 0;
                updateAutoSimulateButton();
            }

            function stepAutoSimulation() {
                var nextState = autoSimulationTimeline[autoSimulationIndex];
                if (!nextState) {
                    stopAutoSimulation();
                    return;
                }

                applyExampleState(nextState);
                autoSimulationIndex += 1;

                if (autoSimulationIndex >= autoSimulationTimeline.length) {
                    stopAutoSimulation();
                }
            }

            function startAutoSimulation() {
                if (autoSimulationTimer || !window.__srContainer) {
                    return;
                }

                autoSimulationIndex = 0;
                stepAutoSimulation();
                autoSimulationTimer = window.setInterval(stepAutoSimulation, 2200);
                updateAutoSimulateButton();
            }

            document.querySelectorAll('[data-phase]').forEach(function (button) {
                button.addEventListener('click', function () {
                    stopAutoSimulation();
                    var nextState = phases[button.dataset.phase];
                    applyExampleState(nextState);
                });
            });

            if (autoSimulateButton) {
                autoSimulateButton.addEventListener('click', function () {
                    if (autoSimulationTimer) {
                        stopAutoSimulation();
                        return;
                    }

                    startAutoSimulation();
                });
                updateAutoSimulateButton();
            }
        }());
    </script>
</body>
</html>
