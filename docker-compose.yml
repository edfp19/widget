services:
  api:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    working_dir: /app
    command: python backend/server.py
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      ENV: development
      WIDGET_PROVIDER: clickhouse
      REDIS_URL: redis://redis:6379/0
      CLICKHOUSE_HOSTS: http://clickhouse1:8123,http://clickhouse2:8123
      INSERT_QUORUM: "1"
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./configurator:/app/configurator
      - ./sql:/app/sql
      - ./scripts:/app/scripts
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; urllib.request.urlopen(f\"http://127.0.0.1:{os.environ.get('PORT', '8080')}/api/health\")",
        ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      clickhouse1:
        condition: service_healthy
      clickhouse2:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    working_dir: /app
    command: python backend/worker/replay.py
    environment:
      WIDGET_PROVIDER: clickhouse
      REDIS_URL: redis://redis:6379/0
      CLICKHOUSE_HOSTS: http://clickhouse1:8123,http://clickhouse2:8123
      REPLAY_AUTORUN: "false"
      REPLAY_RESET_ON_START: "true"
      INSERT_QUORUM: "1"
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./configurator:/app/configurator
      - ./sql:/app/sql
      - ./scripts:/app/scripts
    depends_on:
      clickhouse1:
        condition: service_healthy
      clickhouse2:
        condition: service_healthy
      redis:
        condition: service_started

  backup:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    working_dir: /app
    command: sh -lc "mkdir -p /backups && while true; do python scripts/backup_clickhouse.py --output-dir /backups; sleep ${BACKUP_INTERVAL_SECONDS:-3600}; done"
    environment:
      CLICKHOUSE_HOSTS: http://clickhouse1:8123,http://clickhouse2:8123
      BACKUP_INTERVAL_SECONDS: "3600"
      BACKUP_RETENTION_COUNT: "5"
    volumes:
      - ./scripts:/app/scripts
      - ./sql:/app/sql
      - backups-data:/backups
    depends_on:
      clickhouse1:
        condition: service_healthy
      clickhouse2:
        condition: service_healthy

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  keeper:
    image: clickhouse/clickhouse-keeper:24.8
    ports:
      - "9181:9181"
    volumes:
      - ./docker/clickhouse/keeper.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
      - keeper-data:/var/lib/clickhouse-keeper

  clickhouse1:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"
    volumes:
      - clickhouse1-data:/var/lib/clickhouse
      - ./docker/clickhouse/common.xml:/etc/clickhouse-server/config.d/common.xml:ro
      - ./docker/clickhouse/macros-clickhouse1.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ./docker/clickhouse/users.xml:/etc/clickhouse-server/users.d/default-user.xml:ro
    depends_on:
      keeper:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-lc",
          "exec 3<>/dev/tcp/127.0.0.1/8123 && printf 'GET /?query=SELECT%%201 HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'",
        ]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 20

  clickhouse2:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8124:8123"
    volumes:
      - clickhouse2-data:/var/lib/clickhouse
      - ./docker/clickhouse/common.xml:/etc/clickhouse-server/config.d/common.xml:ro
      - ./docker/clickhouse/macros-clickhouse2.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ./docker/clickhouse/users.xml:/etc/clickhouse-server/users.d/default-user.xml:ro
    depends_on:
      keeper:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-lc",
          "exec 3<>/dev/tcp/127.0.0.1/8123 && printf 'GET /?query=SELECT%%201 HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'",
        ]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 20

volumes:
  clickhouse1-data:
  clickhouse2-data:
  backups-data:
  keeper-data:
